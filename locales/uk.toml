# Ukrainian strings for the module's own screen.
#
# `[module]` is read by the *host* for the card and the tab; everything else is
# read by the module for its own screen.

[module]
title = "Перевірка хешів"
description = "Обчислює хеші файлу, теки або тексту — MD5, SHA-1, SHA-2, SHA-3, BLAKE2, BLAKE3, українську «Купину» та інші — і звіряє їх із хешем, який вам дали. Інші модулі теж можуть просити в нього хеші."

[ui]
title = "Перевірка хешів"
subtitle = "Хеші файлу, теки або тексту, обчислені на цьому комп'ютері. Нічого нікуди не надсилається."
kind = "Що хешувати"
file = "Файл"
folder = "Тека"
browse = "Огляд…"
algorithm = "Алгоритм"
all = "Усі алгоритми"
text = "Текст"
text_hint = "хешується точно так, як введено, у UTF-8"
expected = "Хеш для порівняння (необов'язково)"
expected_hint = "будь-який із хешів нижче, з назвою алгоритму попереду або без неї"
calculate = "Обчислити"
clear = "Очистити"
nothing = "Хешувати ще нічого: спершу заповніть поле."

# Що можна хешувати — варіанти першого списку.
[kind]
file = "Файл"
folder = "Тека"
text = "Текст"

[result]
of_text = "Текст"
bytes = "{n} байтів"
algorithm = "Алгоритм"
hash = "Хеш"
copy = "Копіювати"
copy_hint = "Двічі клацніть хеш, щоб скопіювати його."
matches = "Збігається: наданий вами хеш — це {what} цього об'єкта."
differs = "Не збігається: за довжиною наданий вами хеш може бути {what}, і він не збігається з жодним хешем цього об'єкта."
not_a_hash = "Те, що ви дали для порівняння, не є хешем, який обчислює цей модуль: у шістнадцятковому записі вони мають 8, 16, 32, 40, 56, 64, 96 або 128 цифр."

# Тека: кожен файл у ній і один хеш для всієї теки.
[folder]
summary = "файлів: {n} · {size} · хешовано алгоритмом {what}"
