hash = "Хеш теки ({what} її списку контрольних сум)"
incomplete = "Хешу теки в цілому немає: не вдалося зчитати об'єктів: {n}, а хеш частини теки не є хешем теки."
copy_list = "Копіювати список контрольних сум"
files = "Файли ({n})"
files_first = "Файли — перші {shown} з {n}; усі вони є у списку контрольних сум"
failed = "Не вдалося зчитати ({n})"
col_file = "Файл"
col_size = "Розмір"
col_why = "Причина"
is_folder = "Збігається: наданий вами хеш — це хеш цієї теки."
is_files = "Знайдено: наданий вами хеш мають файли в цій теці: {n}."
nothing = "Не збігається: наданий вами хеш не є ні {what} цієї теки, ні хешем жодного файлу в ній."
other_kind = "Не порівнювалося: за довжиною наданий вами хеш може бути {given}, а цю теку хешовано алгоритмом {what}. Виберіть той алгоритм і обчисліть знову."

# Короткі сповіщення в кутку.
[notice]
